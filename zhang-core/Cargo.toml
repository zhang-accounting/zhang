[package]
name = "zhang-core"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html



[features]
default = ["iana-time-zone"]
wasm = []
plugin_runtime = ["extism", "dep:cap-std", "dep:base64", "dep:libc"]
openapi = ["dep:gotcha_core", "zhang-ast/openapi"]

[dependencies]
zhang-ast = { version = "0.1", path = "../zhang-ast" }
gotcha_core = { workspace = true, optional = true }
thiserror = { workspace = true }
log = { workspace = true }
itertools = { workspace = true }
bigdecimal = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
strum = { workspace = true }
chrono-tz = { workspace = true }
indexmap = { workspace = true }
http = { workspace = true }
async-trait = { workspace = true }

nom = "7"

chrono = { version = "0.4", default-features = false, features = ["std", "clock", "serde"] }
uuid = { version = "1", default-features = false, features = ["v6", "serde"] }
sha256 = { version = "1.5.0", features = [], default-features = false }
iana-time-zone = { version = "0.1", optional = true }
once_cell = "1.19"
# Pinned: the host memory-bounds check in src/plugin/host.rs hard-codes the extism kernel's
# `MemoryRoot` layout (see KERNEL_LENGTH_ADDR and the *_forge WAT tests). Re-verify that layout
# and the store bounds checks against the kernel source before bumping this.
extism = { version = "=1.8.0", optional = true }
# the version wasi-common (through extism) already brings in; opens the files plugins read inside their grant
cap-std = { version = "3.3.0", optional = true }
base64 = { workspace = true, optional = true }
semver = "1.0.22"
cfg-if = "1.0.0"
minijinja = "2.8"

[target.'cfg(unix)'.dependencies]
# opens the files plugins read without blocking on a FIFO
libc = { version = "0.2", optional = true }

[dev-dependencies]
indoc = "2"
serde_json_path = "0.6"
tempfile = "3.20"
