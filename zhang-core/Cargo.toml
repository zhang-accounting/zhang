[package]
name = "zhang-core"
version.workspace = true
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html



[features]
default = ["iana-time-zone"]
wasm = []
plugin_runtime = ["extism", "dep:wasmtime", "dep:cap-std", "dep:libc", "dep:glob", "dep:ureq", "dep:url", "zhang-shared/http"]
openapi = ["dep:gotcha_core", "zhang-ast/openapi"]

[dependencies]
zhang-ast = { version = "0.3", path = "../zhang-ast" }
zhang-shared = { version = "0.3", path = "../zhang-shared" }
gotcha_core = { workspace = true, optional = true }
thiserror = { workspace = true }
log = { workspace = true }
itertools = { workspace = true }
bigdecimal = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
strum = { workspace = true }
chrono-tz = { workspace = true }
indexmap = { workspace = true }
http = { workspace = true }
# a fast hash for the account names the account lifecycle looks up for every posting (`pipeline::active_accounts`)
rustc-hash = "2"

nom = "7"

chrono = { version = "0.4", default-features = false, features = ["std", "clock", "serde"] }
uuid = { version = "1", default-features = false, features = ["v6", "serde"] }
sha256 = { version = "1.5.0", features = [], default-features = false }
sha2 = "0.11"
iana-time-zone = { version = "0.1", optional = true }
once_cell = "1.19"
# Pinned: the host memory-bounds check in src/plugin/host.rs hard-codes the extism kernel's
# `MemoryRoot` layout (see KERNEL_LENGTH_ADDR and the *_forge WAT tests). Re-verify that layout
# and the store bounds checks against the kernel source before bumping this.
# Re-verified for 1.41.0: its embedded kernel (src/extism-runtime.wasm, SHA-256 d1389b31…) is
# byte-identical to 1.8.0's, so the layout is unchanged; `CurrentPlugin::memory_bytes` still reads
# guest memory without a bounds check, so the host.rs check must stay.
# `wasmtime-exceptions` only sets `config.wasm_exceptions(true)` on every plugin engine, which the embedded Lua
# interpreter needs (its error handling is wasm exception handling); a module without EH instructions is unaffected
extism = { version = "=1.41.0", optional = true, features = ["wasmtime-exceptions"] }
# the engine extism compiles plugins with, for the `Config` that `PluginBuilder::with_wasmtime_config` takes: plugins
# compile on one thread (src/plugin/runtime.rs). The major version extism depends on, which a bump of extism moves too
wasmtime = { version = "49", optional = true, default-features = false }
# opens the files plugins read inside their grant
cap-std = { version = "3.3.0", optional = true }
# what extism brings in already: `allowed_hosts` patterns are matched as extism always did, and plugins' HTTP requests
# go through zhang's own `http_request` (src/plugin/net.rs), on ureq's agent with a resolver zhang controls
glob = { version = "0.3", optional = true }
ureq = { version = "3", optional = true }
url = { version = "2", optional = true }
semver = "1.0.22"
cfg-if = "1.0.0"
minijinja = "2.8"

[target.'cfg(unix)'.dependencies]
# opens the files plugins read without blocking on a FIFO
libc = { version = "0.2", optional = true }

[dev-dependencies]
indoc = "2"
# the Lua plugin tests read what a script's `print` writes to the host's log
tracing = "0.1"
tracing-subscriber = "0.3"
serde_json_path = "0.7"
tempfile = "3.20"
# the integration tests read the lots as the query engine lists them
zhang-query = { path = "../zhang-query" }
zhang-testkit = { path = "../zhang-testkit" }
