# extism 1.41.0 as published on crates.io, vendored by zhang through `[patch.crates-io]` in the workspace's
# Cargo.toml. Changes from the published crate, each marked "zhang patch" in the source:
# - this manifest: no build script (it only writes the C header extism.h with cbindgen), examples, benches or
#   dev-dependencies, which zhang neither needs nor builds
# - src/current_plugin.rs: `memory_bytes` and `memory_bytes_mut` refuse a block outside the kernel's linear memory,
#   instead of slicing past it (a plugin can forge the length of its blocks, and reading them crashed the process)
# - src/plugin.rs, src/pdk.rs: the plugin's error message and log text are escaped in extism's log lines
# - src/plugin.rs: the memory limiter is not reset after instantiation, so the memory an instance starts with counts
#   toward `memory.max_pages` (upstream counted only what it grew by: about twice the limit in all)
# - src/plugin.rs: `Plugin::set_timeout` sets the timeout of an instance's later calls, so that a host can give one
#   call less time than the manifest its plugin was compiled with, without compiling it again (a fraction of a
#   millisecond rounds up: the call is never stopped before its time is up)
# - src/plugin_builder.rs, src/plugin.rs, src/lib.rs: `PluginBuilder::with_cache` compiles with a wasmtime `Cache` the
#   host configured once (re-exported with `CacheConfig`), in place of the one extism sets up from a configuration file
#   at every compilation, which fails the compilation when wasmtime's default directory cannot be created
#
# THIS FILE IS AUTOMATICALLY GENERATED BY CARGO
