# extism 1.30.0 as published on crates.io, vendored by zhang through `[patch.crates-io]` in the workspace's
# Cargo.toml. Changes from the published crate, each marked "zhang patch" in the source:
# - this manifest: no build script (it only writes the C header extism.h with cbindgen), examples, benches or
#   dev-dependencies, which zhang neither needs nor builds
# - src/current_plugin.rs: `memory_bytes` and `memory_bytes_mut` refuse a block outside the kernel's linear memory,
#   instead of slicing past it (a plugin can forge the length of its blocks, and reading them crashed the process)
# - src/plugin.rs, src/pdk.rs: the plugin's error message and log text are escaped in extism's log lines
#
# THIS FILE IS AUTOMATICALLY GENERATED BY CARGO
#
# When uploading crates to the registry Cargo will automatically
# "normalize" Cargo.toml files for maximal compatibility
# with all versions of Cargo and also rewrite `path` dependencies
# to registry (e.g., crates.io) dependencies.
#
# If you are reading this file be aware that the original Cargo.toml
# will likely look very different (and much more reasonable).
# See Cargo.toml.orig for the original contents.

[package]
edition = "2021"
name = "extism"
version = "1.30.0"
authors = [
    "The Extism Authors",
    "oss@extism.org",
]
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "Extism runtime and Rust SDK"
homepage = "https://extism.org"
readme = "README.md"
license = "BSD-3-Clause"
repository = "https://github.com/extism/extism"

[features]
default = [
    "http",
    "register-http",
    "register-filesystem",
    "wasmtime-default-features",
]
http = ["ureq"]
register-filesystem = []
register-http = ["ureq"]
wasmtime-default-features = ["wasmtime/default"]
wasmtime-exceptions = []

[lib]
name = "extism"
path = "src/lib.rs"

[dependencies.anyhow]
version = "1"

[dependencies.async-trait]
version = "0.1"

[dependencies.extism-convert]
version = "1.30.0"
features = ["extism-path"]

[dependencies.extism-manifest]
version = "1.30.0"

[dependencies.glob]
version = "0.3"

[dependencies.libc]
version = "0.2"

[dependencies.serde]
version = "1"
features = ["derive"]

[dependencies.serde_json]
version = "1"

[dependencies.sha2]
version = "0.10"

[dependencies.toml]
version = "0.9"

[dependencies.tracing]
version = "0.1"

[dependencies.tracing-subscriber]
version = "0.3.23"
features = [
    "std",
    "env-filter",
    "fmt",
]

[dependencies.ureq]
version = "3.0"
optional = true

[dependencies.url]
version = "2"

[dependencies.uuid]
version = "1"
features = ["v4"]

[dependencies.wasi-common]
version = "43"

[dependencies.wasmtime]
version = "43"
features = [
    "cache",
    "gc",
    "gc-drc",
    "cranelift",
    "coredump",
    "wat",
    "parallel-compilation",
    "pooling-allocator",
    "demangle",
]
default-features = false

[dependencies.wiggle]
version = "43"

