# "normalize" Cargo.toml files for maximal compatibility
# with all versions of Cargo and also rewrite `path` dependencies
# to registry (e.g., crates.io) dependencies.
#
# If you are reading this file be aware that the original Cargo.toml
# will likely look very different (and much more reasonable).
# See Cargo.toml.orig for the original contents.

[package]
edition = "2021"
name = "extism"
version = "1.41.0"
authors = [
    "The Extism Authors",
    "oss@extism.org",
]
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "Extism runtime and Rust SDK"
homepage = "https://extism.org"
readme = "README.md"
license = "BSD-3-Clause"
repository = "https://github.com/extism/extism"

[features]
default = [
    "http",
    "register-http",
    "register-filesystem",
    "wasmtime-default-features",
]
http = ["ureq"]
register-filesystem = []
register-http = ["ureq"]
wasmtime-default-features = ["wasmtime/default"]
wasmtime-exceptions = []

[lib]
name = "extism"
path = "src/lib.rs"

[dependencies.anyhow]
version = "1"

[dependencies.extism-convert]
version = "1.41.0"
features = ["extism-path"]

[dependencies.extism-manifest]
version = "1.41.0"

[dependencies.glob]
version = "0.3"

[dependencies.libc]
version = "0.2"

[dependencies.serde]
version = "1"
features = ["derive"]

[dependencies.serde_json]
version = "1"

[dependencies.sha2]
version = "0.10"

[dependencies.toml]
version = "0.9"

[dependencies.tracing]
version = "0.1"

[dependencies.tracing-subscriber]
version = "0.3.23"
features = [
    "std",
    "env-filter",
    "fmt",
]

[dependencies.ureq]
version = "3.0"
optional = true

[dependencies.url]
version = "2"

[dependencies.uuid]
version = "1"
features = ["v4"]

[dependencies.wasmtime]
version = "49"
features = [
    "anyhow",
    "cache",
    "gc",
    "gc-drc",
    "cranelift",
    "coredump",
    "wat",
    "parallel-compilation",
    "pooling-allocator",
    "demangle",
]
default-features = false

[dependencies.wasmtime-wasi]
version = "49"
features = ["p1"]
default-features = false
