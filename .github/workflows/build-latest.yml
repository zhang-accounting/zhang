name: Develop Check

on:
  push:
    branches:
      - main
      - develop
  pull_request:
  workflow_dispatch:

# a new push to a pull request cancels its running checks. A run on main or develop is left to finish instead: only
# those runs save the caches every pull request restores, and with merges minutes apart cancelling them meant the
# caches were rarely saved. GitHub still keeps at most one run waiting per branch, so runs on main do not pile up.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  frontend-style-check:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v3
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: frontend install
        run: pnpm install
        working-directory: ./frontend
      - name: frontend style check
        run: pnpm run prettier:check
        working-directory: ./frontend
      # fails on lint errors only; warnings are printed but pass, as locally
      - name: frontend lint
        run: pnpm lint
        working-directory: ./frontend
  frontend-build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v3
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: frontend install
        run: pnpm install
        working-directory: ./frontend
      - name: frontend test
        run: pnpm test
        working-directory: ./frontend
      - name: frontend build
        run: pnpm build
        working-directory: ./frontend
  # the tests run in three parallel jobs: zhang-query, zhang-server, and `others` (every other package, today zhang-core,
  # zhang-ast, beancount, zhang, zhang-plugin-sdk and its examples, and any crate added later, plus the
  # doctests and the zhang-core build without the plugin runtime). Every job builds the test binaries of all the default
  # members, exactly as `cargo test` at the root would, so the features are unified the same way (zhang-server turns
  # on `plugin_runtime` of zhang-core) and every job builds the same artifacts. Each job then runs only its own tests,
  # so every test runs exactly once overall.
  test:
    name: test (${{ matrix.os }}, ${{ matrix.group }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-22.04 ]
        group: [ zhang-query, zhang-server, others ]
        # macOS runners are scarce and slow: only on main, as one job running every test
        include: ${{ fromJSON(github.event_name == 'pull_request' && '[]' || '[{"os":"macOS-latest","group":"all"}]') }}
    steps:
      - uses: actions/checkout@v4
      - name: Install stable
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          # zhang-server/tests/sdk_plugins.rs builds the example plugins of zhang-plugin-sdk for wasm32 and runs
          # them; without the target that test fails on CI (it only skips locally)
          target: wasm32-unknown-unknown
          # the jobs share one cache (rust-cache keys it by the job id, not the matrix), as they build the same
          # artifacts; `others`, which also builds zhang-core alone and the doctests, is the only one that saves it
          cache-save-if: ${{ github.ref == 'refs/heads/main' && (matrix.group == 'others' || matrix.group == 'all') }}
      - name: fake frontend build
        run: mkdir -p dist
        working-directory: ./frontend
      # nextest runs the tests of all test binaries in parallel, where `cargo test` runs the binaries one after another
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - name: Run test
        shell: bash
        env:
          GROUP: ${{ matrix.group }}
        run: |
          case "$GROUP" in
            all) cargo nextest run ;;
            others) cargo nextest run -E 'not (package(zhang-query) | package(zhang-server))' ;;
            *) cargo nextest run -E "package($GROUP)" ;;
          esac
      # nextest does not run doctests
      - name: Run doctests
        if: matrix.group == 'others' || matrix.group == 'all'
        run: cargo test --doc
      # zhang-server enables `plugin_runtime` of zhang-core, so the workspace build above always has it on.
      # Test zhang-core alone to cover the build without the plugin runtime.
      - name: Run zhang-core test without plugin runtime
        if: matrix.group == 'others' || matrix.group == 'all'
        run: cargo test -p zhang-core
  wasm-test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache-save-if: ${{ github.ref == 'refs/heads/main' }}

      - uses: jetli/wasm-pack-action@v0.4.0
        with:
          # Optional version of wasm-pack to install(eg. 'v0.9.1', 'latest')
          version: 'v0.12.1'

      - name: build wasm
        run: wasm-pack build
        working-directory: ./bindings/wasm

      - name: pack wasm
        run: wasm-pack pack
        working-directory: ./bindings/wasm

  # builds the docs site on every pull request, so a broken page or link is caught before it lands;
  # deploys it only on pushes to main or develop
  docs:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      
      - uses: pnpm/action-setup@v3
        with:
          version: 9
      
      - uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: 'pnpm'
          cache-dependency-path: docs/pnpm-lock.yaml
      
      - name: Install dependencies
        run: pnpm install
        working-directory: ./docs
      
      - name: Build documentation
        run: pnpm build
        working-directory: ./docs
      
      - name: Deploy to Cloudflare Pages
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CF_API_TOKEN }}
          accountId: ${{ secrets.CF_ACCOUNT_ID }}
          workingDirectory: './docs'
          command: pages deploy dist --project-name zhang-docs

  coverage:
    if: false
    runs-on: ubuntu-22.04
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
      - name: fake frontend build
        run: mkdir -p dist
        working-directory: ./frontend
      - name: Run cargo-tarpaulin
        uses: actions-rs/tarpaulin@v0.1
        with:
          version: '0.22.0'
          args: '--all-features --workspace --ignore-tests --out Lcov'
      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v4
      - name: Archive code coverage results
        uses: actions/upload-artifact@v4
        with:
          name: code-coverage-report
          path: cobertura.xml
  formatter:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: nightly
          components: rustfmt
          cache: false
      - name: fake frontend build
        run: mkdir -p dist
        working-directory: ./frontend
      - name: Format
        run: cargo fmt --all -- --check

  clippy-check:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          components: clippy
          target: wasm32-unknown-unknown
          cache-save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: fake frontend build
        run: mkdir -p dist
        working-directory: ./frontend
      - name: Clippy
        run: cargo clippy --all-features --all-targets -- -D warnings -D clippy::dbg_macro -A clippy::empty_docs
      # the plugin SDK's Extism bindings and the exports of `plugin!` only exist on wasm32
      - name: Clippy the plugin SDK for wasm32
        run: cargo clippy --target wasm32-unknown-unknown -p zhang-plugin-sdk -p zhang-plugin-example-guard -p zhang-plugin-example-summary -p zhang-plugin-example-lots -p zhang-plugin-example-balances -- -D warnings -D clippy::dbg_macro -A clippy::empty_docs

  typo-checker:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: typos-action
        uses: crate-ci/typos@v1.23.6

  # the single check that branch protection requires: it passes only when every job it needs passed,
  # so adding a job or changing a matrix only needs a change here, not in the repository settings
  checks-passed:
    if: always()
    needs: [frontend-style-check, frontend-build, test, wasm-test, docs, formatter, clippy-check, typo-checker]
    runs-on: ubuntu-22.04
    steps:
      - name: Fail unless every required job passed
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped')
        run: exit 1
      - run: echo "all required jobs passed"
