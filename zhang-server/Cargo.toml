[package]
name = "zhang-server"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

build = "build.rs"

[features]
frontend = ["rust-embed"]

[dependencies]
zhang-core = { version = "0.1", path = "../zhang-core", features = ["plugin_runtime", "openapi"] }
zhang-ast = { version = "0.1", path = "../zhang-ast", features = ["openapi"] }
zhang-query = { version = "0.1", path = "../zhang-query" }
gotcha_core = { workspace = true }

base64 = { workspace = true }
serde = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["fs"] }
log = { workspace = true }
itertools = { workspace = true }
bigdecimal = { workspace = true }
zhang-shared = { version = "0.1", path = "../zhang-shared" }
indexmap = { workspace = true }
strum = { workspace = true }
serde_json = { workspace = true }
chrono-tz = { workspace = true }
axum = { workspace = true }
gotcha = { workspace = true }
bytes = { workspace = true }

rust-embed = { version = "8.3", optional = true }
futures = "0.3"
futures-util = "0.3"
notify = "8"
reqwest = { version = "0.13", features = ["json"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
mime_guess = "2"
self_update = "1"
tower-http = { version = "0.5.0", features = ["cors", "limit"] }
async-stream = "0.3.5"
serde_qs = "0.13.0"
webauthn-rs = "0.5"
hmac = "0.13"
sha2 = "0.11"
rand = "0.10"
percent-encoding = "2"
form_urlencoded = "1"

[build-dependencies]
chrono = { version = "0.4" }

[dev-dependencies]
beancount = { version = "0.1", path = "../extensions/beancount" }
zhang-testkit = { path = "../zhang-testkit", features = ["server"] }
webauthn-authenticator-rs = { version = "0.5", features = ["softpasskey"] }
tower = { version = "0.4", features = ["util"] }
tempfile = "3.20"
