[package]
name = "zhang-testkit"
version = "0.1.0"
edition = "2021"
publish = false
description = "Shared test support for the zhang workspace: the fixture ledgers, ledger builders and golden files"

[lib]
doctest = false

[features]
# the HTTP harness of the zhang-server tests (`http`): only zhang-server's own tests turn it on, as it depends on
# zhang-server, which enables zhang-core's plugin runtime
server = ["dep:zhang-server", "dep:axum", "dep:gotcha", "dep:tokio", "dep:tower", "dep:bytes"]

[dependencies]
zhang-ast = { path = "../zhang-ast" }
# no features: a crate tested alone (`cargo test -p zhang-core`) must not get the plugin runtime through its tests
zhang-core = { path = "../zhang-core" }
beancount = { path = "../extensions/beancount" }
bigdecimal = { workspace = true }
chrono = "0.4"
tempfile = "3.20"
serde_json = { workspace = true }

zhang-server = { path = "../zhang-server", optional = true }
axum = { workspace = true, optional = true }
gotcha = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }
tower = { version = "0.4", features = ["util"], optional = true }
bytes = { workspace = true, optional = true }
