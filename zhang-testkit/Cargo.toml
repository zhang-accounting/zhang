[package]
name = "zhang-testkit"
version = "0.1.0"
edition = "2021"
publish = false
description = "Shared test support for the zhang workspace: the fixture ledgers, ledger builders and golden files"

[lib]
doctest = false

[dependencies]
zhang-ast = { path = "../zhang-ast" }
# no features: a crate tested alone (`cargo test -p zhang-core`) must not get the plugin runtime through its tests
zhang-core = { path = "../zhang-core" }
beancount = { path = "../extensions/beancount" }
tempfile = "3.20"
serde_json = { workspace = true }
# the `query` feature: the beanquery oracle harness (`oracle`), for the crates that test the query engine
zhang-query = { path = "../zhang-query", optional = true }
bigdecimal = { workspace = true, optional = true }
chrono = { version = "0.4", default-features = false, features = ["std"], optional = true }

[features]
query = ["dep:zhang-query", "dep:bigdecimal", "dep:chrono"]
