[package]
name = "zhang-plugin-example-guard"
version = "0.1.0"
edition = "2021"
description = "Example zhang processor plugin: flags large expenses and future transactions, and stamps stable ids"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
# a plugin outside this repository depends on it through git:
# zhang-plugin-sdk = { git = "https://github.com/zhang-accounting/zhang", tag = "v…" }
zhang-plugin-sdk = { path = "../.." }
