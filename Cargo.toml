[workspace]
resolver = "2"
members = [
    "zhang-core",
    "zhang-query",
    "zhang-shared",
    "zhang-ast",
    "zhang-server",
    "zhang-cli",
    "extensions/*",
    "bindings/wasm",
    "zhang-plugin-sdk",
    "zhang-plugin-sdk/examples/*",
    "zhang-testkit",
]
# extism, vendored and patched (see vendor/extism/Cargo.toml): a dependency, not a member of this workspace
exclude = ["vendor/extism"]
# the plugin SDK and its example plugins are default members: on a native target the SDK links nothing from
# Extism (its host calls answer `unavailable`), so they build, test and lint natively like every other crate.
# The examples become real plugins only when built for wasm32-unknown-unknown (see zhang-server/tests/sdk_plugins.rs)
default-members = [
    "zhang-core",
    "zhang-query",
    "zhang-shared",
    "zhang-ast",
    "zhang-server",
    "zhang-cli",
    "extensions/*",
    "zhang-plugin-sdk",
    "zhang-plugin-sdk/examples/*",
    # shared test support of the integration tests; a default member so that its own checks run with `cargo test`
    "zhang-testkit",
]

# the version of the zhang release, shared by the crates that make up the server and the CLI (`version.workspace =
# true`). A source build reports it in `zhang --version`, `/api/info` and the web UI; a release build reports the
# tag's version instead (the release workflow writes it to `.build_version`, see zhang-cli/build.rs), so keep the two
# equal when tagging. A bump also changes the bundled MCP plugin's `VERSION` (plugins/mcp/mcp.lua) and, when the minor
# version moves, the `version = "0.x"` requirements of the members' path dependencies. Not covered: zhang-plugin-sdk
# and its examples (the plugin API's own version) and bindings/wasm (the npm package's version, written from the tag by
# bindings/wasm/update-cargo-version.sh)
[workspace.package]
version = "0.3.0"

[workspace.dependencies]
base64 = "0.23"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ['macros', "tracing", "signal", "rt-multi-thread"] }
log = "0.4"
itertools = "0.15"
strum = { version = "0.28", features = ["derive"] }
# pinned: from 0.4.8 on, a zero is displayed without its scale ("0" instead of "0.00"), which changes zhang's API JSON
# and written ledgers
bigdecimal = { version = "=0.4.3", features = ["serde"] }
indexmap = { version = "2.2", features = ["serde"] }
axum = { version = "0.7", features = ["macros", "multipart"] }
gotcha = { version = "0.3", features = ["openapi"] }
gotcha_core = { version = "0.3" }
bytes = "1.6.0"
chrono-tz = "0.10"
http = "1.1"

openssl = { version = "0.10", features = ["vendored"] }



# extism 1.41.0 with zhang's patches, see vendor/extism/Cargo.toml. zhang-core pins `extism = "=1.41.0"`: bumping it
# means vendoring the new version and carrying the patches over (or dropping those upstream has made)
[patch.crates-io]
extism = { path = "vendor/extism" }

[profile.dev]
split-debuginfo = "unpacked"

# optimize the dependencies but not the workspace crates, which stay quick to rebuild and easy to debug: the tests
# spend much of their time in dependency code (bigdecimal, chrono, hashing, wasmtime), and a dependency only rebuilds
# when it changes
[profile.dev.package."*"]
opt-level = 2

[profile.release]
# Tell `rustc` to optimize for small code size.
opt-level = "s"


