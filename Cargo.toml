[workspace]
resolver = "2"
members = [
    "zhang-core",
    "zhang-query",
    "zhang-shared",
    "zhang-ast",
    "zhang-server",
    "zhang-cli",
    "extensions/*",
    "bindings/python",
    "bindings/wasm",
    "zhang-plugin-sdk",
    "zhang-plugin-sdk/examples/*",
]
# the plugin SDK and its example plugins are default members: on a native target the SDK links nothing from
# Extism (its host calls answer `unavailable`), so they build, test and lint natively like every other crate.
# The examples become real plugins only when built for wasm32-unknown-unknown (see zhang-server/tests/sdk_plugins.rs)
default-members = [
    "zhang-core",
    "zhang-query",
    "zhang-shared",
    "zhang-ast",
    "zhang-server",
    "zhang-cli",
    "extensions/*",
    "bindings/python",
    "zhang-plugin-sdk",
    "zhang-plugin-sdk/examples/*",
]

[workspace.dependencies]
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ['macros', "tracing", "signal", "rt-multi-thread"] }
log = "0.4"
itertools = "0.14"
strum = { version = "0.26", features = ["derive"] }
# pinned: from 0.4.8 on, a zero is displayed without its scale ("0" instead of "0.00"), which changes zhang's API JSON
# and written ledgers
bigdecimal = { version = "=0.4.3", features = ["serde"] }
indexmap = { version = "2.2", features = ["serde"] }
axum = { version = "0.7", features = ["macros", "multipart"] }
gotcha = { version = "0.3", features = ["openapi"] }
gotcha_core = { version = "0.3" }
bytes = "1.6.0"
chrono-tz = "0.10"
http = "1.1"
async-trait = "0.1"

openssl = { version = "0.10", features = ["vendored"] }



[profile.dev]
split-debuginfo = "unpacked"

# optimize the dependencies but not the workspace crates, which stay quick to rebuild and easy to debug: the tests
# spend much of their time in dependency code (bigdecimal, chrono, hashing, wasmtime), and a dependency only rebuilds
# when it changes
[profile.dev.package."*"]
opt-level = 2

[profile.release]
# Tell `rustc` to optimize for small code size.
opt-level = "s"


