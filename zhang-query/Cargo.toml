[package]
name = "zhang-query"
version = "0.1.0"
edition = "2021"
description = "A BQL-compatible query engine that evaluates directly over zhang's in-memory ledger store"

[dependencies]
zhang-shared = { version = "0.1", path = "../zhang-shared" }
zhang-core = { version = "0.1", path = "../zhang-core" }
zhang-ast = { version = "0.1", path = "../zhang-ast" }
bigdecimal = { workspace = true }
indexmap = { workspace = true }

chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
nom = "7"
regex = "1"
# a fast hash for the names the postings cache looks up per row (`table::cache`)
rustc-hash = "2"
# a fast keyed hash for the items of `IN`, which a client writes (`compiler::ConstSet`)
foldhash = "0.2"
# the parameters of a query given as JSON (`params::from_json`), as the API and plugins give them
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { version = "1", default-features = false }

[dev-dependencies]
zhang-testkit = { path = "../zhang-testkit", features = ["query"] }
tempfile = "3.20"
# the allocator of the `zhang` binary, for the timings of `examples/query_bench.rs`
mimalloc = "0.1"
