[package]
name = "zhang-query"
version = "0.1.0"
edition = "2021"
description = "A BQL-compatible query engine that evaluates directly over zhang's in-memory ledger store"

[dependencies]
zhang-shared = { version = "0.1", path = "../zhang-shared" }
zhang-core = { version = "0.1", path = "../zhang-core" }
zhang-ast = { version = "0.1", path = "../zhang-ast" }
bigdecimal = { workspace = true }
indexmap = { workspace = true }

chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
nom = "7"
regex = "1"
uuid = { version = "1", default-features = false }

[dev-dependencies]
zhang-testkit = { path = "../zhang-testkit" }
serde_json = { workspace = true }
tempfile = "3.20"
