[alias]
# RFC #698's differential fuzzer of the budgets on its long range, the seeds 1 to 10,000 (or those
# ZHANG_BUDGET_FUZZ_SEEDS names), in release: the bundled script zhang:budget against the oracle, the SDK's budget
# analyzer (built for wasm32-unknown-unknown, which must be installed). The nightly `Budget fuzz` workflow runs it; see
# docs/src/content/docs/developers/testing.md, "The differential fuzzer".
budget-fuzz = "test --release -p zhang-server --test golden budget_fuzz_long_run -- --ignored --nocapture"
