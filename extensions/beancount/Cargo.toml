[package]
name = "beancount"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
zhang-ast = { version = "0.1", path = "../../zhang-ast" }
zhang-core = { version = "0.1", path = "../../zhang-core" }
nom = "7"
itertools = { workspace = true }
chrono = { version = "0.4", features = ["serde"] }
bigdecimal = { workspace = true }

[dev-dependencies]
indoc = "2"
serde_json = { workspace = true }
tempfile = "3.20"
# the tests read the lots as the query engine lists them
zhang-query = { path = "../../zhang-query" }
# `tests/posting_metadata.rs` shares zhang-core's `tests/support` module, which uses the testkit
zhang-testkit = { path = "../../zhang-testkit" }